  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      color: #333;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 10px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .product-card {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    .product-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background-color: #eee;
    }

    .product-info {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1a252f;
    }

    .product-price {
      font-size: 1.25rem;
      font-weight: bold;
      color: #27ae60;
      margin-bottom: 12px;
    }

    .product-meta {
      font-size: 0.85rem;
      color: #666;
      margin-top: auto;
    }

    .product-meta div {
      margin-top: 4px;
    }

    .badge {
      display: inline-block;
      background: #eef2f5;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-right: 4px;
      margin-bottom: 4px;
    }
  </style>
</head>

    function renderProducts(items) {
      const container = document.getElementById('product-container');
      container.innerHTML = '';

      items.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';

        const colorsBadges = product.colors.map(c => `<span class="badge">${c}</span>`).join('');
        const sizesBadges = product.sizes.map(s => `<span class="badge">${s}</span>`).join('');

        card.innerHTML = `
          <img class="product-image" src="${product.img}" alt="${product.title}" loading="lazy">
          <div class="product-info">
            <h2 class="product-title">${product.title}</h2>
            <div class="product-price">${product.price}</div>
            <div class="product-meta">
              <div><strong>Größen:</strong> ${sizesBadges}</div>
              <div><strong>Farben:</strong> ${colorsBadges}</div>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Produkte beim Laden der Seite anzeigen
    document.addEventListener('DOMContentLoaded', () => renderProducts(products));
  </script>
