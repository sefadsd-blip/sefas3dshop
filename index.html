<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sefas3DShop - Custom 3D-Drucke &amp; Design</title>
  <style>
    :root {
      --bg-dark: #121214;
      --card-bg: #1e1e24;
      --card-hover: #262630;
      --accent: #ff6b00;
      --accent-hover: #e05d00;
      --text-main: #f0f0f5;
      --text-muted: #a0a0b0;
      --border-color: #2e2e38;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header & Navigation */
    header {
      background-color: #1a1a20;
      border-bottom: 1px solid var(--border-color);
      padding: 15px 30px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .logo span {
      color: var(--text-main);
    }

    .search-bar {
      flex: 1;
      max-width: 400px;
      position: relative;
    }

    .search-bar input {
      width: 100%;
      padding: 10px 15px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background-color: #121214;
      color: var(--text-main);
      outline: none;
      transition: border 0.2s;
    }

    .search-bar input:focus {
      border-color: var(--accent);
    }

    .cart-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .cart-btn:hover {
      background-color: var(--card-hover);
    }

    .cart-count {
      background-color: var(--accent);
      color: #fff;
      font-size: 0.8rem;
      padding: 2px 7px;
      border-radius: 10px;
    }

    /* Container & Layout */
    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 30px 20px;
      width: 100%;
      flex: 1;
    }

    /* Filter & Kategorien */
    .filter-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .filter-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 15px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Produkt-Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 25px;
    }

    .product-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      background-color: var(--card-hover);
    }

    .img-container {
      width: 100%;
      height: 220px;
      background-color: #121214;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .product-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .product-price {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .product-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .badge-group {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .badge {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    .add-to-cart-btn {
      margin-top: 15px;
      width: 100%;
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .add-to-cart-btn:hover {
      background-color: var(--accent-hover);
    }

    /* Footer */
    footer {
      background-color: #1a1a20;
      border-top: 1px solid var(--border-color);
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 40px;
    }
  </style>
</head>

    let currentCategory = 'alle';
    let cartCount = 0;

    function renderProducts(items) {
      const container = document.getElementById('productContainer');
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">Keine Produkte gefunden.</p>';
        return;
      }

      items.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';

        const colorBadges = product.colors.map(c => `<span class="badge">${c}</span>`).join('');
        const sizeBadges = product.sizes.map(s => `<span class="badge">${s}</span>`).join('');

        // Generiert ein Platzhalter-Bild
        const imgUrl = `https://placehold.co/400x300/1e1e24/ff6b00?text=${encodeURIComponent(product.title)}`;

        card.innerHTML = `
          <div class="img-container">
            <img class="product-image" src="${imgUrl}" alt="${product.title}" loading="lazy">
          </div>
          <div class="product-info">
            <h2 class="product-title">${product.title}</h2>
            <div class="product-price">${product.price}</div>
            <div class="product-meta">
              <div><strong>Größe:</strong> <div class="badge-group">${sizeBadges}</div></div>
              <div style="margin-top: 6px;"><strong>Farben:</strong> <div class="badge-group">${colorBadges}</div></div>
            </div>
            <button class="add-to-cart-btn" onclick="addToCart()">In den Warenkorb</button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = products.filter(p => {
        const matchesCategory = currentCategory === 'alle' || p.category === currentCategory;
        const matchesQuery = p.title.toLowerCase().includes(query);
        return matchesCategory && matchesQuery;
      });
      renderProducts(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterProducts();
    }

    function addToCart() {
      cartCount++;
      document.getElementById('cartCount').innerText = cartCount;
    }

    document.addEventListener('DOMContentLoaded', () => renderProducts(products));
  </script>
